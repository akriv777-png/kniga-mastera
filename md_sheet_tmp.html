<html><body style="margin:0;background:#c9b48a"><canvas id=c></canvas><script>
const files=(location.hash.slice(1)||'mapdecor1').split(',');let n=0;
function go(){const M=window.MAPDECOR,f=files[files.length-1];const items=M.items.filter(i=>i.id.startsWith('md'+f.replace('mapdecor','')+'-'));const S=56,cell=3*S+20,cols=12;const cv=document.getElementById('c');cv.width=cols*cell;cv.height=Math.ceil(items.length/cols)*(cell+14);const c=cv.getContext('2d');c.fillStyle='#cdb88c';c.fillRect(0,0,cv.width,cv.height);
items.forEach((it,i)=>{const x=(i%cols)*cell+10,y=Math.floor(i/cols)*(cell+14)+6;c.strokeStyle='rgba(0,0,0,.12)';for(let a=0;a<=3;a++){c.beginPath();c.moveTo(x+a*S,y);c.lineTo(x+a*S,y+3*S);c.moveTo(x,y+a*S);c.lineTo(x+3*S,y+a*S);c.stroke()}const sc=Math.min(1,3/Math.max(it.w,it.h));c.save();c.translate(x,y);c.scale(sc,sc);M.render(c,it.id,S);c.restore();c.fillStyle='#000';c.font='10px sans-serif';c.fillText(it.n.slice(0,34),x,y+3*S+11)});document.title='done '+items.length}
['mapdecor0'].concat(files).forEach(f=>{const s=document.createElement('script');s.src='/data/'+f+'.js';s.async=false;s.onload=()=>{if(++n==files.length+1)go()};document.body.appendChild(s)});/*
const s0=document.createElement('script');s0.src='/data/mapdecor0.js';s0.async=false;s0.onload=()=>{if(++n==files.length+1)go()};document.body.insertBefore(s0,document.body.firstChild);
*/</script></body></html>
