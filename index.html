<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Днд</title>
<meta name="theme-color" content="#10090a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Книга Мастера и Книга Игрока">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app/css/book.css">
<script src="vendor/telegram-web-app.js"></script>
</head>
<body class="dnd-home">
  <div class="home page" style="padding-bottom: calc(var(--sab) + 28px)">
    <header class="home-head">
      <p class="kicker" data-greet>Гримуар стола</p>
      <h1>Днд</h1>
      <p class="sub">Книга Мастера и Книга Игрока</p>
    </header>
    <p class="sub" style="font-weight:700">Выбери режим</p>
    <div class="card">
      <h2>Игрок</h2>
      <p class="muted">Введи код комнаты, который дал Мастер</p>
      <label class="sr-only" for="room-code">Код комнаты</label>
      <input id="room-code" class="inp code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="КОД КОМНАТЫ">
      <button type="button" class="btn" id="btn-player">Войти</button>
    </div>
    <div class="card">
      <h2>Мастер</h2>
      <p class="muted">За печатью — пароль гримуара. Доступ к столу подтверждает хозяин бота.</p>
      <button type="button" class="btn" id="btn-master">Войти как Мастер</button>
    </div>
    <p class="err" id="home-msg" hidden></p>
    <p class="muted center">Через бота @Nezich_dnd_bot книга открывается как приложение Telegram.</p>
  </div>
<script>window.DND_ROOT="./";</script>
<script type="module" src="app/js/home.js"></script>
</body>
</html>
